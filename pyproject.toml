[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "A self-evolving Agent Skill platform based on execution feedback"
requires-python = ">=3.10"
# 本事务不引入任何第三方运行时依赖；仅标准库 + 开发期 pytest（见 requirements.txt）。
dependencies = []

[tool.setuptools]
packages = ["evoagent"]
