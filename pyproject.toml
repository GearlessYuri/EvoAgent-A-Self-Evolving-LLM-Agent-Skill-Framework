[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent"
version = "0.1.0"
description = "A self-evolving Agent Skill platform based on execution feedback"
requires-python = ">=3.10"
# 运行时第三方依赖 openai（OpenAI 兼容 SDK）；开发期依赖 pytest（见 requirements.txt）。
dependencies = ["openai>=1.0"]

[tool.setuptools.packages.find]
include = ["evoagent*"]
